renderer.domElement.addEventListener('pointerup',e=>{ if(!dragX) return; const moved=Math.hypot(e.clientX-dragX[0],e.clientY-dragX[1]), dt=Date.now()-dragX[2]; dragX=null; if(moved>10||dt>600) return; ptr.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(ptr,camera); const hits=ray.intersectObjects(clickable,true); if(hits.length){ let o=hits[0].object; while(o&&!o.userData.kind) o=o.parent; if(o) tapped(o); } });
$('fsBtn').addEventListener('click',()=>{ SND.tap(); const el=document.documentElement; if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); } else document.exitFullscreen(); });
$('liteBtn').addEventListener('click',()=>{ lite.on=!lite.on; $('liteBtn').setAttribute('aria-pressed',lite.on); renderer.shadowMap.enabled=!lite.on; renderer.setPixelRatio(lite.on?1:Math.min(window.devicePixelRatio||1,2)); scene.traverse(o=>{ if(o.material) o.material.needsUpdate=true; }); SND.tap(); });
let night=false; $('nightBtn').addEventListener('click',()=>{ night=!night; $('nightBtn').setAttribute('aria-pressed',night); $('nightBtn').textContent=night?'☀️ Day':'🌙 Night'; scene.background=new THREE.Color(night?0x1a1440:0xbfe9ff); scene.fog.color.set(night?0x1a1440:0xbfe9ff); sun.intensity=night?.25:1.5; hemi.intensity=night?.4:.9; SND.toggle(); scene.traverse(o=>{ if(o.userData.window) o.material=mat(night?0x1a1440:0xa3ecfa); }); bubble(cur,night?'Night night, dollhouse. Tap the lamp in the bedroom!':'Good morning!'); });
function roomAt(x,z,f){ let best=null; ROOMS.forEach(r=>{ if(r.f===f&&Math.abs(x-r.x)<=r.w/2&&Math.abs(z-r.z)<=r.d/2) best=r; }); return best; }
let curRoom=null;
$('loading').classList.add('off'); camera.position.set(-22,10,22); setTimeout(()=>{ bubble(0,'Welcome to my dollhouse! Tap the closet button, or ride the elevator up to the walk-in closet.',6000); setTimeout(()=>bubble(1,'I want a hat.',3000),4000); setTimeout(()=>bubble(2,'I want ALL the hats.',3000),6500); },400);
/* ─── loop ─── */
const tmp=new THREE.Vector3(), tmp2=new THREE.Vector3();
function loop(){ requestAnimationFrame(loop); const dt=Math.min(.05,clock.getDelta()); t+=dt; anims.forEach(f=>f());
  const c=CH[cur], m=c.g; const busy=seated||m.parent!==scene||elevBusy; const spd=(run?14:7)*dt; let mx=0,mz=0; if(!busy){ if(keys.u){ mx+=Math.sin(heading); mz+=Math.cos(heading); } if(keys.d){ mx-=Math.sin(heading); mz-=Math.cos(heading); } if(keys.l) heading+=1.9*dt; if(keys.r) heading-=1.9*dt; }
  if(m.userData.goal){ tmp.subVectors(m.userData.goal,m.position); tmp.y=0; if(tmp.length()<1.5) m.userData.goal=null; else { tmp.normalize(); mx=tmp.x; mz=tmp.z; heading=Math.atan2(tmp.x,tmp.z); } }
  const moving=(mx||mz)&&mode==='walk'&&!busy; if(moving){ const nx=m.position.x+mx*spd, nz=m.position.z+mz*spd; const f=c.floor; const inside=f>=0?(Math.abs(nx)<W/2-1.5&&Math.abs(nz)<D/2-1.2):(Math.abs(nx)<90&&nz>D/2+1&&nz<90); if(inside||(f===0&&nz>D/2-1.2&&nz<D/2+3&&Math.abs(nx)<6)){ m.position.x=nx; m.position.z=nz; } if(f===0&&m.position.z>D/2+1){ c.floor=-1; setFloorButtons(-1); } if(f===-1&&m.position.z<D/2+1&&Math.abs(m.position.x)<6){ c.floor=0; setFloorButtons(0); } m.rotation.y=heading; m.position.y=floorY(c.floor)+Math.abs(Math.sin(t*(run?16:10)))*.2; } else if(!busy){ m.position.y=floorY(c.floor); m.rotation.y=heading; }
  CH.forEach((ch,i)=>{ const p=ch.g.userData.parts; const isMe=i===cur; const mv=isMe?moving:ch.moving; p.armL.rotation.x=mv?Math.sin(t*10+i)*.7:0; p.armR.rotation.x=mv?-Math.sin(t*10+i)*.7:0; p.legL.rotation.x=mv?-Math.sin(t*10+i)*.7:0; p.legR.rotation.x=mv?Math.sin(t*10+i)*.7:0; if(ch.waveT){ const k=(Date.now()-ch.waveT)/1200; p.armR.rotation.z=k<1?-2.4+Math.sin(k*18)*.35:-.3; if(k>=1) ch.waveT=0; } p.head.rotation.z=Math.sin(t*1.6+i)*.05; if(ch.g.userData.tail) ch.g.userData.tail.rotation.z=Math.sin(t*2.5+i)*.3; ch.g.userData.locks.forEach((l,k)=>{ l.rotation.z=(k?-1:1)*(.15+Math.sin(t*2+k)*.08); }); const cape=ch.g.userData.wings.userData.cape; if(cape) cape.rotation.x=.15+(mv?Math.sin(t*8)*.2+.4:Math.sin(t*2)*.05); const w=ch.g.userData.wings.userData.w; if(w){ w[0].rotation.y=Math.sin(t*6)*.5; w[1].rotation.y=-Math.sin(t*6)*.5; }
    if(!isMe&&ch.follow&&ch.g.parent===scene&&ch.floor===c.floor&&!busy){ tmp.subVectors(m.position,ch.g.position); tmp.y=0; const d=tmp.length(); if(d>5+i*1.5){ tmp.normalize(); const step=Math.min(d-4,9*dt); ch.g.position.x+=tmp.x*step; ch.g.position.z+=tmp.z*step; ch.g.rotation.y=Math.atan2(tmp.x,tmp.z); ch.moving=true; } else ch.moving=false; ch.g.position.y=floorY(ch.floor)+(ch.moving?Math.abs(Math.sin(t*10+i))*.2:0); } else if(!isMe) ch.moving=false;
    if(!isMe&&ch.floor!==c.floor&&ch.follow&&!elevBusy&&ch.g.parent===scene){ ch.floor=c.floor; ch.g.position.set(m.position.x+3+i,floorY(c.floor),m.position.z+2); }
    if(ch.bub.classList.contains('on')){ if(Date.now()>ch.bubUntil) ch.bub.classList.remove('on'); else { ch.g.getWorldPosition(tmp2); tmp2.y+=4.4; tmp2.project(camera); const sx=(tmp2.x*.5+.5)*innerWidth, sy=(-tmp2.y*.5+.5)*innerHeight; const vis=tmp2.z<1&&sx>-100&&sx<innerWidth+100&&sy>0; ch.bub.style.display=vis?'':'none'; ch.bub.style.left=Math.max(130,Math.min(innerWidth-130,sx))+'px'; ch.bub.style.top=Math.max(60,sy)+'px'; } } });
  const focus=new THREE.Vector3(); m.getWorldPosition(focus); const r=roomAt(focus.x,focus.z,c.floor); if(r&&r!==curRoom){ curRoom=r; $('roomChip').textContent=r.em+' '+r.name; if(!m.userData.goal) bubble(cur,r.name+'. '+r.lesson,5000); }
  if(mode==='walk'){ focus.y+=2.5; const cyy=Math.sin(camPitch)*camDist, chh=Math.cos(camPitch)*camDist; let want=tmp2.set(focus.x-Math.sin(heading)*chh,focus.y+cyy,focus.z-Math.cos(heading)*chh); /* keep the camera in front of the house so walls do not block */ if(c.floor>=0&&want.z<-D/2+3) want.z=-D/2+3; if(c.floor>=0&&want.y<floorY(c.floor)+2) want.y=floorY(c.floor)+2; if(c.floor>=0&&c.floor<2&&want.y>floorY(c.floor)+FH-1.2&&want.z<D/2+2) want.y=floorY(c.floor)+FH-1.2; camera.position.lerp(want,.1); camera.lookAt(focus); controls.target.copy(focus); } else controls.update();
  renderer.render(scene,camera); }
loop();
function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); } window.addEventListener('resize',resize); resize();
document.addEventListener('visibilitychange',()=>{ if(document.hidden) clock.stop(); else clock.start(); });
window.dollTap=(k,match)=>{ const o=clickable.find(x=>x.userData.kind===k&&(!match||Object.keys(match).every(m=>x.userData[m]===match[m]))); if(o){ tapped(o); return true; } return false; }; window.dollGo=(x,z,f)=>{ const c=CH[cur]; c.floor=f; c.g.position.set(x,floorY(f),z); setFloorButtons(f); }; window.dollState=()=>({cur,floor:CH[cur].floor,pos:CH[cur].g.position.toArray().map(v=>+v.toFixed(1)),outfit:CH[cur].outfit,kit:kit.step,din:{plates:din.plates,cups:din.cups,forks:din.forks},baby:baby.step,quest:Object.fromEntries(Object.entries(quest).filter(([k])=>k!=='items')),room:curRoom&&curRoom.id}); window.dollOutfit=(i,o)=>{ applyOutfit(i,o); checkChallenge(); }; window.dollSetChallenge=n=>{ challenge=CHALLENGES[n]; }; window.dollFloor=goFloor; window.dollCloset=openCloset; window.dollChallenge=()=>$('cChallenge').click();
</script>
