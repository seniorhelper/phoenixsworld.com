const LESSONS=[['🕳️ What is a black hole?','A black hole is what is left when a giant star runs out of fuel and collapses. It squeezes so much stuff into such a tiny spot that its gravity is stronger than anything — not even light can get out. That is why it looks black. The glowing ring around it is gas swirling in, getting super hot before it falls. Black holes do not suck things up like a vacuum. If our Sun turned into a black hole (it will not — it is too small), Earth would keep circling exactly where it is. There is a giant one in the middle of our Milky Way called Sagittarius A-star, four million times heavier than the Sun. Scientists took a real picture of a black hole in 2019 — a fuzzy orange donut.'],['🌌 What is a nebula?','A nebula is a giant cloud of gas and dust in space. Some nebulas are star nurseries, where gravity pulls the gas together until it gets so hot and squished that a star turns on — like the Orion Nebula. Some nebulas are the leftovers of a star that died, like the Crab Nebula (a star that exploded) or the Ring Nebula (a star that puffed off its layers). They look colorful in telescope photos because different gases glow different colors: hydrogen is pink-red, oxygen is blue-green.'],['⭐ What are constellations?','A constellation is a pattern people drew between stars, like connect-the-dots. The stars are not really close to each other — one might be 30 light-years away and its neighbor 800 — they just line up from Earth. Different cultures saw different pictures. The stars in this ship are at their real positions: find Orion\u2019s belt, the Big Dipper, and the W of Cassiopeia.'],['🌠 Milky Way','The Milky Way is our home galaxy: hundreds of billions of stars in a giant spinning pinwheel. We live out on one of the arms. When you look at the milky band across the night sky, you are looking through the pinwheel edge-on. The thickest, brightest part is toward the center, in Sagittarius (the teapot).'],['🪐 The planets in order','My Very Excellent Mother Just Served Us Nachos: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune. The first four are small and rocky. The last four are giants made of gas and ice. Between Mars and Jupiter is the asteroid belt.'],['🚀 Speed and distance','Light is the fastest thing there is: 300,000 kilometers every second. Sunlight takes 8 minutes to reach Earth. The nearest star after the Sun is 4 light-years away — the light you see left it 4 years ago. When you look at Andromeda, you see light that left 2.5 million years ago. Looking far away is looking back in time.'],['🌡️ Why is space cold? (and hot!)','Space has almost no air, so there is nothing to hold heat. In the shade it is minus 270 degrees. In the Sun it is boiling hot. That is why spacesuits are white and puffy — layers to keep the astronaut just right, with air to breathe and water to drink.']];

function loop(){ requestAnimationFrame(loop); const dt=Math.min(.05,clock.getDelta()); t+=dt; anims.forEach(f=>f());

  const fwd=tmp.set(Math.sin(heading)*Math.cos(pitch),Math.sin(pitch),Math.cos(heading)*Math.cos(pitch));
  if(!eva.on&&!S.landed){ if(S.warp){ S.warpT+=dt; const spd=Math.min(900,60+S.warpT*500); S.vel.copy(fwd).multiplyScalar(spd); if(S.autopilot){ const to=tmp2.subVectors(S.autopilot.p,ship.position); const d=to.length(); heading=Math.atan2(to.x,to.z); pitch=Math.asin(Math.max(-1,Math.min(1,to.y/d)))*.9; if(d<(S.autopilot.land?60:250)){ endWarp(); const n=S.autopilot.name; S.autopilot=null; bubble(cur,'Arrived: '+n+'. Press the pink button.',4000); refreshAct(); } } else if(S.warpT>6) endWarp(); S.dist+=spd*dt; } else { const thr=S.fuel>0?S.throttle:0; S.vel.addScaledVector(fwd,thr*40*dt); S.vel.multiplyScalar(1-.55*dt); S.fuel=Math.max(0,S.fuel-thr*dt*.35); S.dist+=S.vel.length()*dt; if(S.fuel<=0&&Math.random()<.01) bubble(cur,'Out of fuel! Coast to a planet and REFUEL.',3000); } ship.position.addScaledVector(S.vel,dt); ship.rotation.set(-pitch,heading,keys.l?.35:keys.r?-.35:0,'YXZ'); ship.userData.flame.scale.setScalar(.4+S.throttle*1.2+(S.warp?1.5:0)); ship.userData.flame.children.forEach((f,i)=>f.scale.y=1+Math.sin(t*30+i)*.25);
    /* sun gravity + never fall in */ const dsun=ship.position.length(); if(dsun<45){ ship.position.setLength(45); S.vel.multiplyScalar(-.5); S.shield=Math.max(0,S.shield-10); S.shake=1; bubble(cur,'HOT HOT HOT! Shields took a hit!',2000); }
    /* asteroids */ if(!S.warp){ const r=Math.hypot(ship.position.x,ship.position.z); if(r>285&&r<345&&Math.abs(ship.position.y)<8){ for(let i=0;i<700;i++){ const q=window.__ast[i]; const ax=Math.cos(q.a)*q.d, az=Math.sin(q.a)*q.d; if(Math.abs(ax-ship.position.x)<q.s+2.5&&Math.abs(az-ship.position.z)<q.s+2.5&&Math.abs(q.y-ship.position.y)<q.s+2){ S.shield=Math.max(0,S.shield-6); S.shake=1; S.vel.multiplyScalar(-.4); SND.thud(); bubble(cur,pick(['Asteroid! Shields down '+Math.round(S.shield)+'%!','BONK. Steer around them!','Dodge! Up or down gets you out of the belt.']),2000); q.a+=.3; break; } } if(Math.random()<.02&&!S.beltWarned){ S.beltWarned=true; toast('☄️ ASTEROID BELT — dodge the rocks! Fly up or down to get above it.'); } } }
    /* gems */ const gem=nearestGem(); if(gem&&gem.position.distanceTo(ship.position)<5) grab(gem); if(S.shield<100) S.shield=Math.min(100,S.shield+dt*1.5);
  } else if(eva.on){ S.vel.multiplyScalar(1-.3*dt); me.position.addScaledVector(S.vel,dt); me.rotation.set(0,heading,0); me.position.y+=Math.sin(t*1.2)*.01; const d=me.position.distanceTo(ship.position); if(d>40){ S.vel.add(ship.position.clone().sub(me.position).normalize().multiplyScalar(6)); if(Math.random()<.02) bubble(cur,'Tether is tight! It pulls me back to the ship. Never float away.',3000); } const p=me.userData.parts; p.armL.rotation.x=Math.sin(t*1.5)*.3; p.armR.rotation.x=Math.cos(t*1.3)*.3; p.legL.rotation.x=Math.sin(t*1.1)*.2; p.legR.rotation.x=-Math.sin(t*1.1)*.2; if(me.userData.tail) me.userData.tail.rotation.z=Math.sin(t*2)*.4; if(eva.bubble) me.userData.bubble.rotation.y+=dt*.3; }
  /* glitter */ if(S.glitter&&!eva.on&&Math.random()<.9){ const g=glit.find(x=>x.life<=0); if(g){ g.life=1.2; g.s.visible=true; g.s.position.copy(ship.position).add(new THREE.Vector3(rnd(-1.5,1.5),rnd(-1.5,1.5),rnd(-1.5,1.5))).addScaledVector(fwd,-5); g.s.scale.setScalar(rnd(1,2.5)); } } glit.forEach(g=>{ if(g.life>0){ g.life-=dt; g.s.material.opacity=Math.max(0,g.life); if(g.life<=0) g.s.visible=false; } });
  if(S.starDrop){ dropT+=dt; if(dropT>5){ dropT=0; P.starDrop(30); } }
  /* warp streaks */ if(S.warp){ const pa=warpLines.geometry.attributes.position; const spd=S.vel.length(); for(let i=0;i<400;i++){ const base=ship.position.clone().add(new THREE.Vector3(rnd(-40,40),rnd(-40,40),rnd(-40,40))).addScaledVector(fwd,rnd(20,220)); const tail=base.clone().addScaledVector(fwd,-Math.min(80,spd*.12)); pa.setXYZ(i*2,base.x,base.y,base.z); pa.setXYZ(i*2+1,tail.x,tail.y,tail.z); } pa.needsUpdate=true; }
  /* crew bubbles */ CREW.forEach((c,i)=>{ if(c.waveT&&c.g.visible){ const k=(Date.now()-c.waveT)/1200; c.g.userData.parts.armR.rotation.z=k<1?-2.4+Math.sin(k*18)*.35:.35; if(k>=1) c.waveT=0; } if(c.bub.classList.contains('on')){ if(Date.now()>c.bubUntil) c.bub.classList.remove('on'); else { const src=(eva.on&&i===cur)?c.g:ship; src.getWorldPosition(tmp2); tmp2.y+=(eva.on&&i===cur)?3.6:4.5; tmp2.project(camera); const sx=(tmp2.x*.5+.5)*innerWidth, sy=(-tmp2.y*.5+.5)*innerHeight; const vis=tmp2.z<1; c.bub.style.display=vis?'':'none'; c.bub.style.left=Math.max(130,Math.min(innerWidth-130,sx))+'px'; c.bub.style.top=Math.max(120,Math.min(innerHeight-260,sy-(i*8)))+'px'; } } });
  /* zib rides on Mars */ const mars=bodies.find(b=>b.n==='Mars'); zib.position.copy(mars.g.position).add(new THREE.Vector3(0,mars.r+.2,0)); zib.rotation.y=t*.3;
  /* camera: third person, full 360 + pitch */ const focus=new THREE.Vector3(); me.getWorldPosition(focus); focus.y+=eva.on?2:1.5; const cy=Math.sin(camPitch)*camDist, ch=Math.cos(camPitch)*camDist; const want=tmp2.set(focus.x-Math.sin(heading)*ch,focus.y+cy,focus.z-Math.cos(heading)*ch); if(S.shake>0&&S.shakeOn&&!REDUCED){ want.x+=rnd(-1,1)*S.shake*1.5; want.y+=rnd(-1,1)*S.shake*1.5; } S.shake=Math.max(0,S.shake-dt*1.5); camera.position.lerp(want,S.warp?.25:.12); camera.lookAt(focus); camLight.position.copy(camera.position); camera.fov=60+(S.warp?Math.min(25,S.warpT*8):0); camera.updateProjectionMatrix();
  /* dashboard */ dashT+=dt; if(dashT>.12){ dashT=0; const spd=S.vel.length(); const k=Math.min(1,spd/300); $('gSpeedArc').setAttribute('stroke-dashoffset',String(126-126*k)); $('gSpeedN').setAttribute('transform','rotate('+(-90+180*k)+' 50 70)'); $('gFuelArc').setAttribute('stroke-dashoffset',String(126-126*S.fuel/100)); $('gFuelT').textContent=Math.round(S.fuel)+'%'; $('gFuelArc').setAttribute('stroke',S.fuel<20?'#ff5c5c':'#7dff9b'); $('gShieldArc').setAttribute('stroke-dashoffset',String(126-126*S.shield/100)); $('gShieldT').textContent=Math.round(S.shield)+'%'; $('rVel').textContent=S.warp?'WARP '+(spd/60).toFixed(1):(spd*11).toFixed(0)+' km/s'; $('rDist').textContent=S.dist<1000?Math.round(S.dist*1000)+' km':(S.dist*.001).toFixed(1)+' M km'; const n=nearest(); $('rNear').textContent=n?n.n.split(' ')[0]+' '+Math.max(0,Math.round(n.d))+'k':'—'; const a=currentAction(); if(a.label!==lastLabel){ lastLabel=a.label; $('actBtn').textContent=a.label; $('actBtn').classList.toggle('hot',!/BOOST|JET/.test(a.label)); } let w='☀️ SOLAR SYSTEM'; if(n&&n.b&&n.d<n.b.r*3+30) w=n.b.def?n.b.def.em+' '+n.b.n.toUpperCase():'☀️ THE SUN'; else if(n&&n.bh&&n.d<300) w='🕳️ BLACK HOLE'; else if(n&&n.deep&&n.d<500) w='🌌 '+n.deep.def[0].toUpperCase(); else if(ship.position.length()>1200) w='🌌 DEEP SPACE'; if(w!==lastWhere){ lastWhere=w; $('where').textContent=w; } SND.engine(S.warp?1:S.throttle); }
  renderer.render(scene,camera); }
loop();
function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); } window.addEventListener('resize',resize); resize();
document.addEventListener('visibilitychange',()=>{ if(document.hidden) clock.stop(); else clock.start(); });
window.spaceState=()=>({pos:ship.position.toArray().map(v=>+v.toFixed(0)),speed:+S.vel.length().toFixed(1),fuel:+S.fuel.toFixed(0),shield:+S.shield.toFixed(0),warp:S.warp,eva:eva.on,cur,dust,action:$('actBtn').textContent,where:$('where').textContent,landed:S.landed&&S.landed.n,kitty:S.kitty,glitter:S.glitter}); window.spaceGo=name=>goTo(name); window.spaceAct=()=>$('actBtn').click(); window.spaceTeleport=(x,y,z)=>{ ship.position.set(x,y,z); S.vel.set(0,0,0); refreshAct(); }; window.spaceKeys=keys; window.spaceTap=(k,match)=>{ const o=clickable.find(x=>x.userData.kind===k&&(!match||Object.keys(match).every(m=>x.userData[m]===match[m]))); if(o){ tapped(o); return true; } return false; }; window.spaceBodies=()=>bodies.map(b=>({n:b.n,p:b.g.position.toArray().map(v=>+v.toFixed(0)),r:b.r})); window.spaceBH=()=>bh.position.toArray().map(v=>+v.toFixed(0)); window.spaceEndWarp=endWarp;
