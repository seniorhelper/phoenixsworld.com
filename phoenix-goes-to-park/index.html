    if(!isMe&&c.follow&&c.g.parent===scene&&!riding.on){ tmp.subVectors(m.position,c.g.position); tmp.y=0; const d=tmp.length(); if(d>6+i*2){ tmp.normalize(); const step=Math.min(d-5,11*dt); const nx=c.g.position.x+tmp.x*step, nz=c.g.position.z+tmp.z*step; if(Math.hypot(nx-POND.x,nz-POND.z)>POND.r+1){ c.g.position.x=nx; c.g.position.z=nz; } c.g.rotation.y=Math.atan2(tmp.x,tmp.z); c.moving=true; } else c.moving=false; c.g.position.y=c.moving?Math.abs(Math.sin(t*10+i))*.25:0; } else if(!isMe) c.moving=false;
    if(c.bub.classList.contains('on')){ if(Date.now()>c.bubUntil) c.bub.classList.remove('on'); else { c.g.getWorldPosition(tmp2); tmp2.y+=4.4; tmp2.project(camera); const sx=(tmp2.x*.5+.5)*innerWidth, sy=(-tmp2.y*.5+.5)*innerHeight; const vis=tmp2.z<1&&sx>-100&&sx<innerWidth+100&&sy>0; c.bub.style.display=vis?'':'none'; c.bub.style.left=Math.max(130,Math.min(innerWidth-130,sx))+'px'; c.bub.style.top=Math.max(60,sy)+'px'; } } });
  /* camera */ if(mode==='walk'){ const focus=new THREE.Vector3(); m.getWorldPosition(focus); focus.y+=2.5; const cyy=Math.sin(camPitch)*camDist, chh=Math.cos(camPitch)*camDist; const want=tmp2.set(focus.x-Math.sin(heading)*chh,focus.y+cyy,focus.z-Math.cos(heading)*chh); if(want.y<1.5) want.y=1.5; camera.position.lerp(want,.1); camera.lookAt(focus); controls.target.copy(focus); } else controls.update();
  /* action label */ const a=currentAction(); if(a.label!==lastLabel){ lastLabel=a.label; $('actBtn').textContent=a.label; $('actBtn').classList.toggle('hot',!/RUN|🐢/.test(a.label)); }
  /* where am I */ let w='🌳 Phoenix\u2019s Sparkle Park'; for(const z of WHERE){ if(Math.hypot(m.position.x-z[0],m.position.z-z[1])<z[2]){ w=z[3]; break; } } if(w!==lastWhere){ lastWhere=w; $('where').textContent=w; }
  /* play equipment idle anims */ if(play.swirl){ play.swirl.rotation.z+=dt*(play.swirl.userData.spin||0); play.swirl.userData.spin=Math.max(0,(play.swirl.userData.spin||0)-dt*2); } play.swings.forEach((s,i)=>{ if(!s.userData.on) s.rotation.x*=.98; }); if(play.seesaw&&riding.kind!=='seesaw') play.seesaw.userData.plank.rotation.z*=.97; play.ducks.forEach((d,i)=>{ const u=d.userData; if(u.target){ tmp.subVectors(u.target,d.position); tmp.y=0; if(tmp.length()<1.5){ u.target=null; SND.pop(); } else { tmp.normalize(); d.position.addScaledVector(tmp,4*dt); d.rotation.y=Math.atan2(tmp.x,tmp.z)-Math.PI/2; } } else { u.a+=u.s*dt; d.position.set(POND.x+Math.cos(u.a)*u.r,.15+Math.sin(t*2+i)*.08,POND.z+Math.sin(u.a)*u.r); d.rotation.y=-u.a-Math.PI/2; } if(u.hop){ const k=(Date.now()-u.hop)/500; d.position.y+=k<1?Math.sin(k*Math.PI)*.8:0; if(k>=1) u.hop=0; } });
  play.fountain.forEach(dr=>{ const u=dr.userData; u.life+=dt; dr.position.set(POND.x+u.v.x*u.life,1+u.v.y*u.life-9*u.life*u.life,POND.z+u.v.z*u.life); if(u.life>1.4){ u.life=0; u.v.set(rnd(-2,2),rnd(8,12),rnd(-2,2)); } });
  play.squirrels.forEach(s=>{ const u=s.userData; u.t+=dt; if(!u.tg||u.t>3){ u.t=0; u.tg=[u.home[0]+rnd(-10,10),u.home[1]+rnd(-10,10)]; } const dx=u.tg[0]-s.position.x, dz=u.tg[1]-s.position.z, d=Math.hypot(dx,dz); if(d>.3){ s.position.x+=dx/d*4*dt; s.position.z+=dz/d*4*dt; s.rotation.y=Math.atan2(dx,dz); s.position.y=Math.abs(Math.sin(t*12))*.4; } u.tail.rotation.x=.6+Math.sin(t*6)*.3; if(u.hop){ const k=(Date.now()-u.hop)/500; s.position.y+=k<1?Math.sin(k*Math.PI)*1.5:0; if(k>=1) u.hop=0; } });
  /* kite */ if(kite.flying&&kite.o){ const w=kite.wind; const wind=1+Math.sin(t*.7)*.3; const pull=moving?1:0; kite.h=Math.max(3,Math.min(48,kite.h+(pull*6-1.2)*dt*wind)); const tgt=tmp.copy(m.position).add(new THREE.Vector3(w.x*kite.h*.6+Math.sin(t*1.3)*2,kite.h,w.y*kite.h*.6+Math.cos(t*.9)*2)); kite.o.position.lerp(tgt,.05); kite.o.rotation.z=Math.sin(t*2)*.25; kite.o.rotation.y=Math.atan2(kite.o.position.x-m.position.x,kite.o.position.z-m.position.z); const arr=kite.line.geometry.attributes.position; const hp=m.userData.parts.hand.getWorldPosition(new THREE.Vector3()); arr.setXYZ(0,hp.x,hp.y,hp.z); arr.setXYZ(1,kite.o.position.x,kite.o.position.y-1.2,kite.o.position.z); arr.needsUpdate=true; if(kite.h>=47&&!kite.max){ kite.max=true; addStar(3); P.confetti(60); bubble(cur,'THE TOP OF THE SKY! Look how tiny it is!'); } if(kite.h<=3.2&&!moving&&Math.random()<.01) bubble(cur,'It is falling — run into the wind!',2500); }
  /* disc */ if(disc.o){ disc.v.y-=9*dt; disc.v.multiplyScalar(1-.6*dt); disc.o.position.addScaledVector(disc.v,dt); disc.o.rotation.y+=dt*12; if(disc.o.position.y<=.3){ disc.o.position.y=.3; const b=play.baskets[disc.hole]; const d=b?disc.o.position.distanceTo(b.position):99; if(d<2){ SND.glass(); P.confetti(50); disc.total+=disc.throws; bubble(cur,disc.throws===1?'HOLE IN ONE?! ARE YOU KIDDING ME?!':'In the chains! Hole '+(disc.hole+1)+' in '+disc.throws+' throws.'); addStar(disc.throws===1?5:2); disc.hole=(disc.hole+1)%9; disc.throws=0; if(disc.hole===0){ bubble(cur,'ALL NINE HOLES! Total: '+disc.total+'. You are a disc golf pro!',6000); disc.total=0; } scene.remove(disc.o); disc.o=null; hold('disc'); } else { /* pick it back up when near */ scene.remove(disc.o); const spot=disc.o.position.clone(); disc.o=null; const ghost=mesh(new THREE.CylinderGeometry(.55,.55,.08,20),M.hotpink,spot.x,.3,spot.z); ghost.userData.kind='discpick'; clickable.push(ghost); disc.ghost=ghost; toast('Walk to the disc to pick it up (or press GO near it).'); } } }
  if(disc.ghost&&Math.hypot(m.position.x-disc.ghost.position.x,m.position.z-disc.ghost.position.z)<2.5){ scene.remove(disc.ghost); clickable.splice(clickable.indexOf(disc.ghost),1); disc.ghost=null; hold('disc'); toast('Got it. Throw again — hole '+(disc.hole+1)+'.'); }
  if(ball.o){ ball.v.y-=14*dt; ball.o.position.addScaledVector(ball.v,dt); ball.o.rotation.x+=dt*6; if(ball.o.position.y<.5){ ball.o.position.y=.5; ball.v.y=Math.abs(ball.v.y)*.5; ball.v.x*=.8; ball.v.z*=.8; } if(ball.v.length()<.5&&Math.hypot(m.position.x-ball.o.position.x,m.position.z-ball.o.position.z)<2.5){ scene.remove(ball.o); ball.o=null; hold('ball'); } }
  /* lava */ if(lava){ for(let i=0;i<lavaPos.count;i+=3){ lavaPos.setZ(i,(Math.sin(lavaBase[i*3]*.2+t*2)+1)*.012+(Math.cos(lavaBase[i*3+1]*.17+t*1.5)+1)*.012); } lavaPos.needsUpdate=true; lavaMat.emissiveIntensity=.8+Math.sin(t*6)*.3; const onGround=m.position.y<.6&&!riding.on&&!(near(0,0,34)&&(near(0,0,9)||m.position.y>1)); const onRubber=near(0,0,34); if(m.position.y<.6&&!riding.on&&!onRubber){ lavaScore.burn+=dt; if(lavaScore.burn>1.5){ lavaScore.burn=0; SND.oops(); bubble(cur,pick(['OW OW OW HOT! Get on the rubber!','My shoes are melting! (Not really.)','LAVA! Jump on something!']),2000); m.position.y=2; } } else { lavaScore.safe+=dt; } }
  /* water */ if(water&&Math.random()<.05&&puddles.some(p=>Math.hypot(p.position.x-m.position.x,p.position.z-m.position.z)<p.geometry.parameters.radius)&&moving){ for(let i=0;i<6;i++){ const d=mesh(new THREE.SphereGeometry(.14,5,4),M.water,m.position.x+rnd(-.5,.5),.3,m.position.z+rnd(-.5,.5)); let vy=rnd(.1,.2),life=.6; anims.push(()=>{ if(life<=0) return; d.position.y+=vy; vy-=.012; life-=.016; if(life<=0) scene.remove(d); }); } if(Math.random()<.2) SND.pop(); }
  renderer.render(scene,camera); }
loop();
function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); } window.addEventListener('resize',resize); resize();
document.addEventListener('visibilitychange',()=>{ if(document.hidden) clock.stop(); else clock.start(); });
window.parkState=()=>({cur,pos:me().position.toArray().map(v=>+v.toFixed(1)),stars,holding:holding&&holding.kind,riding:riding.kind,kite:kite.flying?+kite.h.toFixed(1):null,disc:{hole:disc.hole,throws:disc.throws},lava,water,night,action:$('actBtn').textContent}); window.parkGo=(x,z)=>{ me().userData.goal=null; me().position.set(x,0,z); }; window.parkAct=()=>$('actBtn').click(); window.parkTap=(k,match)=>{ const o=clickable.find(x=>x.userData.kind===k&&(!match||Object.keys(match).every(m=>x.userData[m]===match[m]))); if(o){ tapped(o,o.position); return true; } return false; }; window.parkHeading=h=>{ heading=h; }; window.parkKeys=keys; window.parkSpell=()=>spell;
