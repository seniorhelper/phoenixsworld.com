const GUIDE={bear:{name:'Black bear',badge:'away',fact:'She is far across the lake, eating berries. Bears want to be left alone. Never feed one, never get close, and keep food in the bear box at night. Say good day and move away!',em:'🐻'},deer:{name:'Mule deer',badge:'look',fact:'Big ears like a mule! They come to the lake at dawn and dusk to drink. Stay quiet and still and they will stay too.',em:'🦌'},moose:{name:'Moose',badge:'away',fact:'The biggest animal in the valley. Moose look calm but can run fast. If you see one, back away slowly and give it lots of room.',em:'🫎'},squirrel:{name:'Pine squirrel',badge:'look',fact:'Chatters at you from the branches. Please do not feed it — squirrels that eat people-food get sick and forget how to find pinecones.',em:'🐿️'},chipmunk:{name:'Chipmunk',badge:'look',fact:'Stripes down the back and cheeks full of seeds. They will try to steal your marshmallows. Zip the bag!',em:'🐿️'},marmot:{name:'Yellow-bellied marmot',badge:'look',fact:'A fat sun-bather on the rocks. It whistles when it sees a hawk. Listen for the whistle on the ridge!',em:'🦫'},hawk:{name:'Red-tailed hawk',badge:'look',fact:'Circling high up, looking for mice with eyes eight times sharper than yours.',em:'🦅'},frog:{name:'Chorus frog',badge:'look',fact:'Tiny frog, HUGE song. Look but do not pick it up — the oils on our hands hurt their skin.',em:'🐸'},dragonfly:{name:'Dragonfly',badge:'safe',fact:'A helicopter with four wings. It eats mosquitoes, so it is your best friend at the lake.',em:'🪰'},monarch:{name:'Monarch butterfly',badge:'safe',fact:'Orange and black. It flies all the way to Mexico for winter — thousands of miles on paper wings.',em:'🦋'},ladybug:{name:'Ladybug',badge:'safe',fact:'Red with black dots. Farmers love them because they eat the bugs that eat plants.',em:'🐞'},recluse:{name:'Brown recluse spider',badge:'away',fact:'Brown, with a tiny violin shape on its back. It is beautiful, and it can be dangerous. It is not mean — it just does not want to be touched. Say good day and move away! Never put your hands under logs without looking.',em:'🕷️'},widow:{name:'Black widow',badge:'away',fact:'Shiny black with a red hourglass under her belly. She hides in dark corners and under rocks. Look with your eyes, never with your hands.',em:'🕷️'},ant:{name:'Carpenter ant',badge:'safe',fact:'Big black ants that live in old logs. They are the forest recyclers — they turn dead wood back into dirt.',em:'🐜'},trout:{name:'Rainbow trout',badge:'look',fact:'A pink stripe down the side. Trout like cold clear water. Wet your hands before you hold one so you do not hurt its slime coat.',em:'🐟'},beaver:{name:'Beaver',badge:'look',fact:'Built the dam at the pond with sticks and mud. Beavers make ponds that hundreds of other animals need.',em:'🦫'},owl:{name:'Great horned owl',badge:'look',fact:'Hoo-hoo! Comes out at night. It can turn its head almost all the way around.',em:'🦉'},firefly:{name:'Firefly',badge:'safe',fact:'A beetle with a light in its tail. They blink to say hello to each other. Catch one gently in your hands and let it go.',em:'✨'},ivy:{name:'Poison ivy',badge:'away',fact:'Leaves of three, let it be! Shiny leaves in threes. It gives you an itchy rash. Stay on the trail and you will never touch it.',em:'🌿'},cattail:{name:'Cattail',badge:'safe',fact:'Looks like a hot dog on a stick. Red-winged blackbirds nest in them.',em:'🌾'},columbine:{name:'Colorado columbine',badge:'look',fact:'Colorado\u2019s state flower — purple and white. Take a picture, not the flower. Leave it for the bees and the next hiker.',em:'💐'},mushroom:{name:'Fly agaric mushroom',badge:'away',fact:'Red with white spots, like a storybook. NEVER eat any wild mushroom. Even pretty ones can make you very sick.',em:'🍄'},track:{name:'Animal tracks',badge:'safe',fact:'Can you tell who walked here? Deer make two teardrops. Bears make a big foot with five toes. Raccoons look like tiny hands.',em:'🐾'}};

  /* recluse under a log near the falls trail, widow under a rock on the ridge */ critter('recluse',-38,-70,g=>{ const log=mesh(new THREE.CylinderGeometry(.9,.9,5,8),M.bark,0,.9,0,g); log.rotation.z=Math.PI/2; spider(g,mat(0x8a5a2b),.55,-.2); },()=>{}); critter('widow',148,-92,g=>{ mesh(new THREE.DodecahedronGeometry(1.2,0),M.rock,0,.8,0,g); spider(g,mat(0x111111),.45,1.3); },()=>{});

  /* bugs in the air */ for(let i=0;i<8;i++){ const kind=pick(['dragonfly','monarch','monarch','ladybug']); const x=kind==='dragonfly'?rnd(-60,60):rnd(-100,100), z=kind==='dragonfly'?rnd(70,100):rnd(40,160); const g=critter(kind,x,z,gg=>{ const col=kind==='dragonfly'?M.blue:kind==='monarch'?M.orange:M.red; mesh(new THREE.CapsuleGeometry(.08,.6,3,5),kind==='dragonfly'?M.blue:M.ink,0,0,0,gg).rotation.x=Math.PI/2; const wl=mesh(new THREE.PlaneGeometry(.7,.3),new THREE.MeshBasicMaterial({color:col.color,side:THREE.DoubleSide,transparent:true,opacity:.85}),-.35,0,0,gg), wr=wl.clone(); wr.position.x=.35; gg.add(wr); gg.userData.wings=[wl,wr]; },(c,dt)=>{ c.t+=dt; const d=c.kind==='dragonfly'?6:3; c.g.position.x=c.home[0]+Math.cos(c.t*.5)*d; c.g.position.z=c.home[1]+Math.sin(c.t*.7)*d; c.g.position.y=heightAt(c.g.position.x,c.g.position.z)+(c.kind==='dragonfly'?1.5:1.2)+Math.sin(c.t*3)*.3; if(c.g.position.y<1.5) c.g.position.y=1.5; c.g.rotation.y=-c.t*.5; const f=Math.sin(c.t*20)*.9; c.g.userData.wings[0].rotation.y=f; c.g.userData.wings[1].rotation.y=-f; }); }

function spider(g,m,s,x){ mesh(new THREE.SphereGeometry(.35*s,8,6),m,x,.35*s,0,g).scale.set(1,.7,1.3); mesh(new THREE.SphereGeometry(.22*s,8,6),m,x+.35*s,.3*s,0,g); for(let i=0;i<8;i++){ const side=i<4?-1:1; const leg=mesh(new THREE.CylinderGeometry(.03,.02,.9*s,4),m,x+(i%4)*.15*s-.2*s,.3*s,side*.4*s,g); leg.rotation.x=side*1.1; } }
function wander(c,dt,r,spd){ c.t+=dt; if(!c.target||c.t>6){ c.t=0; c.target=[c.home[0]+rnd(-r,r),c.home[1]+rnd(-r,r)]; } const dx=c.target[0]-c.g.position.x, dz=c.target[1]-c.g.position.z; const d=Math.hypot(dx,dz); if(d>.5){ c.g.position.x+=dx/d*spd*dt; c.g.position.z+=dz/d*spd*dt; c.g.rotation.y=Math.atan2(dx,dz)-Math.PI/2; c.g.position.y=heightAt(c.g.position.x,c.g.position.z); if(c.g.userData.legs) c.g.userData.legs.forEach((l,i)=>{ l.rotation.x=Math.sin(t*8+i*1.5)*.5; }); } }
function hop(c,dt,r,spd){ c.t+=dt; if(!c.target||c.t>3){ c.t=0; c.target=[c.home[0]+rnd(-r,r),c.home[1]+rnd(-r,r)]; } const dx=c.target[0]-c.g.position.x, dz=c.target[1]-c.g.position.z; const d=Math.hypot(dx,dz); if(d>.3){ c.g.position.x+=dx/d*spd*dt; c.g.position.z+=dz/d*spd*dt; c.g.rotation.y=Math.atan2(dx,dz); c.g.position.y=heightAt(c.g.position.x,c.g.position.z)+Math.abs(Math.sin(t*12))*.5; } if(c.g.userData.tail) c.g.userData.tail.rotation.x=.6+Math.sin(t*6)*.3; }

  m.position.y=Math.max(heightAt(m.position.x,m.position.z),0.5)+(moving?Math.abs(Math.sin(t*(run?16:10)))*.2:0);
  CAMPERS.forEach((c,i)=>{ const p=c.g.userData.parts; const isMe=i===cur; const mv=isMe?moving:c.moving; p.armL.rotation.x=mv?Math.sin(t*10+i)*.7:0; p.armR.rotation.x=mv?-Math.sin(t*10+i)*.7:0; p.legL.rotation.x=mv?-Math.sin(t*10+i)*.7:0; p.legR.rotation.x=mv?Math.sin(t*10+i)*.7:0; if(c.waveT){ const k=(Date.now()-c.waveT)/1200; p.armR.rotation.z=k<1?-2.4+Math.sin(k*18)*.35:-.3; if(k>=1) c.waveT=0; } p.head.rotation.z=Math.sin(t*1.6+i)*.05; if(c.g.userData.tail) c.g.userData.tail.rotation.z=Math.sin(t*2.5+i)*.3; if(c.g.userData.locks){ c.g.userData.locks[0].rotation.z=.15+Math.sin(t*2)*.08; c.g.userData.locks[1].rotation.z=-.15-Math.sin(t*2+1)*.08; }
    if(!isMe){ /* followers trail behind */ if(c.follow){ const lead=me().position; tmp.subVectors(lead,c.g.position); tmp.y=0; const d=tmp.length(); if(d>6+i*2){ tmp.normalize(); const step=Math.min(d-5,10*dt); const nx=c.g.position.x+tmp.x*step, nz=c.g.position.z+tmp.z*step; if(heightAt(nx,nz)>.4){ c.g.position.x=nx; c.g.position.z=nz; } c.g.rotation.y=Math.atan2(tmp.x,tmp.z); c.moving=true; } else c.moving=false; } else c.moving=false; c.g.position.y=Math.max(heightAt(c.g.position.x,c.g.position.z),.5)+(c.moving?Math.abs(Math.sin(t*10+i))*.2:0); }
    /* bubble projection */ if(c.bub.classList.contains('on')){ if(Date.now()>c.bubUntil){ c.bub.classList.remove('on'); } else { tmp2.copy(c.g.position); tmp2.y+=4.6; tmp2.project(camera); const sx=(tmp2.x*.5+.5)*innerWidth, sy=(-tmp2.y*.5+.5)*innerHeight; const vis=tmp2.z<1&&sx>-100&&sx<innerWidth+100&&sy>0; c.bub.style.display=vis?'':'none'; c.bub.style.left=Math.max(130,Math.min(innerWidth-130,sx))+'px'; c.bub.style.top=Math.max(60,sy)+'px'; } } });
  /* camera */ if(mode==='walk'){ const focus=tmp.copy(m.position).add(new THREE.Vector3(0,3,0)); const cy=Math.sin(camPitch)*camDist, ch=Math.cos(camPitch)*camDist; const want=tmp2.set(focus.x-Math.sin(heading)*ch,focus.y+cy,focus.z-Math.cos(heading)*ch); const ground=heightAt(want.x,want.z)+2; if(want.y<ground) want.y=ground; camera.position.lerp(want,.1); camera.lookAt(focus); controls.target.copy(focus); } else controls.update();
  /* critters + world anims */ critters.forEach(c=>c.move&&c.move(c,dt)); anims.forEach(f=>f()); if(camp.fire.lit){ flames.forEach((f,i)=>{ f.scale.set(1+Math.sin(t*9+f.userData.ph)*.25,1+Math.sin(t*11+f.userData.ph)*.35,1); f.position.y=1+Math.sin(t*7+i)*.15; }); fireG.userData.light.intensity=9+Math.sin(t*13)*2; if(Math.random()<.6) smokeP.push(spawnSmoke(1)); if(Math.random()<.3){ const s=new THREE.Mesh(new THREE.SphereGeometry(.08,4,3),M.fire2); s.position.copy(fireG.position).add(new THREE.Vector3(rnd(-.4,.4),1.5,rnd(-.4,.4))); scene.add(s); sparks.push({o:s,v:new THREE.Vector3(rnd(-1,1),rnd(4,8),rnd(-1,1)),life:1.2}); } }
  for(let i=smokeP.length-1;i>=0;i--){ const s=smokeP[i]; s.o.position.addScaledVector(s.v,dt); s.o.position.x+=weather.wind.x*weather.windSpeed*dt*3; s.o.position.z+=weather.wind.y*weather.windSpeed*dt*3; s.o.scale.addScalar(dt*.6); s.life-=dt; s.o.material.opacity=Math.max(0,s.life/5*.4); if(s.life<=0){ scene.remove(s.o); smokeP.splice(i,1); } }
  for(let i=sparks.length-1;i>=0;i--){ const s=sparks[i]; s.v.y-=6*dt; s.o.position.addScaledVector(s.v,dt); s.life-=dt; if(s.life<=0){ scene.remove(s.o); sparks.splice(i,1); } }
  /* weather */ weather.clouds.forEach(c=>{ c.position.x+=weather.windSpeed*weather.wind.x*dt*6; c.position.z+=weather.windSpeed*weather.wind.y*dt*6; if(c.position.x>430) c.position.x=-430; if(c.position.z>430) c.position.z=-430; });
  if(weather.rain.visible){ const rp=weather.rain.geometry.attributes.position; const cx=camera.position.x, cz=camera.position.z; for(let i=0;i<rp.count;i++){ let y=rp.getY(i)-dt*55; if(y<0){ y=80; rp.setX(i,cx+rnd(-160,160)); rp.setZ(i,cz+rnd(-160,160)); } rp.setY(i,y); } rp.needsUpdate=true; if(weather.mode==='storm'&&Math.random()<.004){ weather.lightningT=.12; SND.noise(.8,.25,300); } }
  if(weather.snow.visible){ const rp=weather.snow.geometry.attributes.position; for(let i=0;i<rp.count;i++){ let y=rp.getY(i)-dt*6; rp.setX(i,rp.getX(i)+Math.sin(t+i)*dt*2+weather.wind.x*dt*3); if(y<0){ y=80; rp.setX(i,camera.position.x+rnd(-160,160)); rp.setZ(i,camera.position.z+rnd(-160,160)); } rp.setY(i,y); } rp.needsUpdate=true; }
  if(weather.lightningT>0){ weather.lightningT-=dt; hemi.intensity=weather.lightningT>0?3:.7; }
  if(inst.aspen){ inst.aspen.rotation.set(0,0,0); } /* aspens shimmer: cheap wobble via material emissive pulse */ if(inst.aspen&&weather.windSpeed>1){ inst.aspen.material.emissive=inst.aspen.material.emissive||new THREE.Color(0); inst.aspen.material.emissive.setScalar(Math.abs(Math.sin(t*6))*.08); }
  if(night>.5&&Math.random()<.004) shootingStar(); for(let i=shooters.length-1;i>=0;i--){ const s=shooters[i]; s.m.position.addScaledVector(s.v,dt); s.life-=dt; s.trail.geometry.setFromPoints([s.p0,s.m.position]); if(s.life<=0){ scene.remove(s.m); scene.remove(s.trail); shooters.splice(i,1); } }
  constObjs.forEach(g=>{ g.userData.stars.forEach(s=>s.material.opacity=night); if(!g.userData.connected) g.userData.line.material.opacity=0; else g.userData.line.material.opacity=night; }); constG.position.copy(camera.position); stars.position.copy(camera.position); sky.position.copy(camera.position);
  if(weather.fireflies){ const fp=weather.fireflies.geometry.attributes.position; for(let i=0;i<fp.count;i+=3){ fp.setY(i,2+Math.sin(t*2+i)*1.5); } fp.needsUpdate=true; weather.fireflies.material.size=1.2+Math.sin(t*5)*.6; }
  /* fishing sim */ fishSim(dt);
  /* trail ends */ TRAILS.forEach(tr=>{ if(tr.end&&!quest.trails.has(tr.name)&&Math.hypot(m.position.x-tr.end[0],m.position.z-tr.end[1])<6){ quest.trails.add(tr.name); questUpdate(); bubble(cur,'End of the '+tr.name+'! '+(quest.trails.size<5?(5-quest.trails.size)+' trails to go.':'ALL FIVE trails. Your legs must be tired!'),5000); SND.tada(); } });
  /* bear wobble */ clickable.forEach(o=>{ if(o.userData.wob){ const k=(Date.now()-o.userData.wob)/600; if(k>=1) o.userData.wob=0; else o.rotation.z=Math.sin(k*Math.PI*2)*.1*(1-k); } });
  renderer.render(scene,camera); }
function fishSim(dt){ const f=fishing; if(f.state==='idle') return; if(f.state==='ready'&&charging){ f.charge=Math.min(1,f.charge+dt*.9); $('fishBar').style.width=(f.charge*100)+'%'; }
  if(f.state==='flying'){ f.bobV.y-=18*dt; f.bob.position.addScaledVector(f.bobV,dt); if(f.bob.position.y<=.3){ f.bob.position.y=.3; if(heightAt(f.bob.position.x,f.bob.position.z)>0){ f.state='ready'; f.bob.visible=false; f.line.visible=false; $('fishMsg').textContent='Splat — that landed on the shore. Cast the other way, toward the water.'; castBtn.textContent='🎣 Hold to cast'; } else { f.state='wait'; f.timer=rnd(3,9)*(f.bait==='lure'?1.4:1); ripple(f.bob.position); SND.pop(); } } }
  if(f.state==='wait'){ f.bob.position.y=.3+Math.sin(t*3)*.08; f.timer-=dt; if(f.timer<=0){ /* choose fish by bait */ let pool=FISH.filter(x=>f.bait==='lure'?x.w>=4||Math.random()<.3:f.bait==='hopper'?x.n.includes('trout')||Math.random()<.4:true); let r=Math.random(), acc=0; f.fish=pool[pool.length-1]; const tot=pool.reduce((a,x)=>a+x.r,0); for(const x of pool){ acc+=x.r/tot; if(r<=acc){ f.fish=x; break; } } f.state='bite'; f.timer=1.6; SND.pluck(); castBtn.textContent='‼️ TAP NOW ‼️'; $('fishMsg').textContent='The bobber DIPPED! Tap!'; } }
  if(f.state==='bite'){ f.bob.position.y=-.6+Math.sin(t*20)*.2; f.timer-=dt; if(f.timer<=0){ f.state='wait'; f.timer=rnd(3,8); f.bob.position.y=.3; $('fishMsg').textContent='Missed it. It will come back. Watch the bobber…'; castBtn.textContent='⏳ Waiting…'; } }
  if(f.state==='fight'){ const fw=f.fish.w; const running=Math.sin(t*(1.5+fw*.1))>.55; if(f.reeling){ f.progress+=dt*(running?.05:.22)*(12/(8+fw)); f.tension+=dt*(running?.9+fw*.05:.25); } else { f.tension-=dt*.7; f.progress-=dt*.04; } f.tension=Math.max(0,f.tension); f.progress=Math.max(0,f.progress); $('fishBar').style.width=(f.progress*100)+'%'; $('tenseBar').style.width=(f.tension*100)+'%'; $('fishMsg').textContent=running?'It is RUNNING — let go a second!':'Reel! Hold!'; f.bob.position.x+=Math.sin(t*4)*dt*3; f.bob.position.z+=Math.cos(t*3)*dt*2; if(f.tension>=1){ endFish(false); SND.oops(); } else if(f.progress>=1){ endFish(true); } }
  if(f.bob.visible){ const p=fishing.rod.getWorldPosition(new THREE.Vector3()); p.y+=2; const arr=f.lineG.attributes.position; arr.setXYZ(0,p.x,p.y,p.z); arr.setXYZ(1,f.bob.position.x,f.bob.position.y,f.bob.position.z); arr.needsUpdate=true; f.line.visible=true; } }
loop();
function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); } window.addEventListener('resize',resize); resize();
document.addEventListener('visibilitychange',()=>{ if(document.hidden) clock.stop(); else clock.start(); });
window.campState=()=>({pos:me().position.toArray().map(v=>+v.toFixed(1)),hour:+hour.toFixed(2),weather:weather.mode,cur,tent:camp.tent,fire:camp.fire,wood:camp.wood,fishing:fishing.state,caught:fishing.caught,quest:{spots:quest.spots.size,litter:quest.litter,tent:quest.tent,fire:quest.fire,fish:quest.fish,smore:quest.smore,out:quest.out,trails:quest.trails.size},trees:Object.values(inst).reduce((a,i)=>a+i.count,0),critters:critters.length});
window.campTap=(k,match)=>{ const o=clickable.find(x=>x.userData.kind===k&&(!match||Object.keys(match).every(m=>x.userData[m]===match[m]))); if(o){ if(o.userData.kind==='constellation') tapConst(o); else tapped(o,{object:o,point:o.position}); return true; } return false; };
window.campDbg=()=>({cam:camera.position.toArray().map(v=>+v.toFixed(1)),me:me().position.toArray().map(v=>+v.toFixed(1)),camDist,camPitch,heading:+heading.toFixed(2),mode,fov:camera.fov,near:camera.near});
window.campPick=(sx,sy)=>{ const r=new THREE.Raycaster(); r.setFromCamera(new THREE.Vector2(sx/innerWidth*2-1,-(sy/innerHeight)*2+1),camera); const hs=r.intersectObjects(scene.children,true); return hs.slice(0,3).map(h=>({type:h.object.type,geo:h.object.geometry&&h.object.geometry.type,col:h.object.material&&h.object.material.color&&'#'+h.object.material.color.getHexString(),d:+h.distance.toFixed(1),kind:h.object.userData.kind||(h.object.parent&&h.object.parent.userData.kind),pos:h.object.getWorldPosition(new THREE.Vector3()).toArray().map(v=>+v.toFixed(0))})); };
window.campGo=(x,z)=>{ me().userData.goal=null; me().position.set(x,0,z); }; window.campHour=h=>{ hour=h; }; window.campWeather=setWeather; window.campSay=(i,t)=>bubble(i,t); window.campWood=()=>{ camp.wood={tinder:3,kindling:6,logs:3}; }; window.campFish=()=>fishing; window.campHook=()=>{ fishing.state='wait'; fishing.timer=0; }; window.campFire=lightFire; window.campSmores=smores; window.campQuest=quest; window.campConst=(i)=>tapConst(constObjs[i]);
